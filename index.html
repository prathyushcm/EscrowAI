<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EscrowAI - Smart Verification</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gradient-to-br from-slate-900 via-blue-900 to-slate-900 min-h-screen flex items-center justify-center p-6 text-slate-200">

    <!-- Glassmorphism Card -->
    <div class="bg-slate-800/60 backdrop-blur-xl border border-slate-700 rounded-2xl shadow-2xl max-w-2xl w-full p-8">
        
        <div class="flex items-center space-x-3 mb-2">
            <div class="w-10 h-10 rounded-full bg-blue-500 flex items-center justify-center shadow-[0_0_15px_rgba(59,130,246,0.5)]">
                <span class="text-xl">🤖</span>
            </div>
            <h1 class="text-3xl font-extrabold text-white tracking-tight">EscrowAI <span class="text-blue-400">Core</span></h1>
        </div>
        <p class="text-slate-400 mb-8 font-medium">Autonomous PR Review & Financial Settlement</p>

        <!-- Input Form -->
        <div id="formSection" class="space-y-5">
            <div>
                <label class="block text-sm font-semibold text-slate-300 mb-1">GitHub PR URL</label>
                <input id="prUrl" type="text" value="https://patch-diff.githubusercontent.com/raw/torvalds/linux/pull/1.diff" class="w-full p-3 bg-slate-900/50 border border-slate-600 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 text-white placeholder-slate-500 outline-none transition">
            </div>
            
            <div>
                <label class="block text-sm font-semibold text-slate-300 mb-1">Payout Amount (₹ INR)</label>
                <!-- Changed to Rupees and set default to 500 -->
                <input id="amount" type="number" value="500" class="w-full p-3 bg-slate-900/50 border border-slate-600 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 text-white outline-none transition">
            </div>

            <!-- Hidden highly secure payload -->
            <input type="hidden" id="diffContent" value="import re\n\nclass MockDatabase:\n    def __init__(self):\n        self.ledger = set()\n    def insert_atomic(self, tx_id):\n        if tx_id in self.ledger:\n            return False\n        self.ledger.add(tx_id)\n        return True\n\ndb = MockDatabase()\n\ndef process_milestone_payment(milestone_id, amount, recipient_address):\n    if type(amount) is not int or amount <= 0:\n        raise ValueError('Strictly positive integer required')\n    if not re.match(r'^0x[a-fA-F0-9]{40}$', recipient_address):\n        raise ValueError('Invalid EVM hex address')\n    if not db.insert_atomic(milestone_id):\n        raise ValueError('Replay attack')\n    return True\n\ndef verify_contract_compliance(pr_diff, acceptance_criteria):\n    if not pr_diff or len(pr_diff) < 10:\n        raise ValueError('Invalid diff size')\n    return True">
            <input type="hidden" id="contractReqs" value="Code must implement atomic database storage for replay protection, use strict Regex for EVM address validation, and prevent Python boolean type coercion. Both Evaluator and Critic must output VERDICT: APPROVED.">

            <button onclick="runVerification()" class="w-full bg-gradient-to-r from-blue-600 to-indigo-600 text-white font-bold py-3.5 rounded-lg hover:from-blue-500 hover:to-indigo-500 transition-all shadow-[0_0_20px_rgba(79,70,229,0.3)] hover:shadow-[0_0_25px_rgba(79,70,229,0.5)]">
                Initialize Multi-Agent Audit
            </button>
        </div>

        <!-- Loading State -->
        <div id="loading" class="hidden mt-8 text-center">
            <div class="inline-block w-8 h-8 border-4 border-blue-500 border-t-transparent rounded-full animate-spin mb-3"></div>
            <p class="text-blue-400 font-semibold animate-pulse">AI Swarm executing AST audit & security validation...</p>
        </div>

        <!-- Results Section -->
        <div id="results" class="hidden mt-8 space-y-4 border-t border-slate-700 pt-6">
            <h2 class="text-lg font-bold text-white mb-3">Consensus Matrix</h2>
            
            <div class="grid grid-cols-2 gap-4">
                <div class="p-4 bg-slate-900/50 border border-slate-700 rounded-lg">
                    <h3 class="font-bold text-blue-400 text-sm tracking-wider uppercase mb-1">Evaluator</h3>
                    <p id="evaluatorVerdict" class="text-sm font-mono"></p>
                </div>
                <div class="p-4 bg-slate-900/50 border border-slate-700 rounded-lg">
                    <h3 class="font-bold text-purple-400 text-sm tracking-wider uppercase mb-1">Critic</h3>
                    <p id="criticVerdict" class="text-sm font-mono"></p>
                </div>
            </div>

            <!-- Dynamic Alert Boxes -->
            <div id="paymentContainer" class="mt-5 p-5 bg-green-900/30 border border-green-700 rounded-lg text-center hidden">
                <p class="font-semibold mb-3 text-green-400">✅ Consensus Reached. Escrow Unlocked.</p>
                <a id="paymentLink" href="#" target="_blank" class="inline-block bg-green-600 text-white px-8 py-2.5 rounded-md font-bold hover:bg-green-500 transition shadow-[0_0_15px_rgba(22,163,74,0.4)]">
                    Access Razorpay Checkout
                </a>
            </div>
            
            <div id="errorContainer" class="mt-5 p-5 bg-red-900/30 border border-red-700 rounded-lg text-center hidden">
                <!-- Error text injected dynamically -->
            </div>
        </div>
    </div>

    <script>
        async function runVerification() {
            // Reset UI
            document.getElementById('loading').classList.remove('hidden');
            document.getElementById('results').classList.add('hidden');
            document.getElementById('paymentContainer').classList.add('hidden');
            document.getElementById('errorContainer').classList.add('hidden');

            // Convert Rupees to Paise for Razorpay automatically!
            const amountInRupees = parseInt(document.getElementById('amount').value);
            const payload = {
                pr_url: document.getElementById('prUrl').value,
                payout_amount: amountInRupees * 100, 
                contract_requirements: document.getElementById('contractReqs').value,
                diff_content: document.getElementById('diffContent').value.replace(/\\n/g, '\n')
            };

            try {
                const response = await fetch('http://localhost:8000/verify-pr', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });
                
                const data = await response.json();
                
                document.getElementById('loading').classList.add('hidden');
                document.getElementById('results').classList.remove('hidden');

                const evaluator = data.ai_agent_feedback.evaluator;
                const critic = data.ai_agent_feedback.critic;
                
                document.getElementById('evaluatorVerdict').innerText = `[${evaluator.verdict}]`;
                document.getElementById('criticVerdict').innerText = `[${critic.verdict}]`;

                // Smart Error Handling
                if (data.both_approved) {
                    if (data.payment_link && !data.payment_link.includes("ERROR")) {
                        // Total Success
                        const payContainer = document.getElementById('paymentContainer');
                        const payLink = document.getElementById('paymentLink');
                        payContainer.classList.remove('hidden');
                        payLink.href = data.payment_link;
                    } else {
                        // AI Approved, but Razorpay Failed (e.g. amount too small)
                        const errBox = document.getElementById('errorContainer');
                        errBox.classList.remove('hidden');
                        errBox.innerHTML = `<p class="font-semibold text-orange-400">⚠️ AI Approved, but Razorpay Error: ${data.payment_link}</p>`;
                    }
                } else {
                    // AI Rejected Code
                    const errBox = document.getElementById('errorContainer');
                    errBox.classList.remove('hidden');
                    errBox.innerHTML = `<p class="font-semibold text-red-400">❌ Code Rejected by AI Security Audit. Payout Locked.</p>`;
                }

            } catch (error) {
                alert("Server connection failed. Is Uvicorn running?");
                document.getElementById('loading').classList.add('hidden');
            }
        }
    </script>
</body>
</html>
